# ==============================================================================
# BUILD SYSTEM CONFIGURATION
# Defines the PEP 517 build backend and requirements for packaging.
# ==============================================================================
[build-system]
requires = ["setuptools>=77.0"]  # Minimal version supporting pyproject.toml
build-backend = "setuptools.build_meta"

# ==============================================================================
# PROJECT METADATA
# Core package information for PyPI distribution and discovery.
# ==============================================================================
[project]
name = "pi-metaboqc"           # Distribution name used by PyPI and pip
version = "1.1.5"              # Static release version following PEP 440
dynamic = ["readme"]           # README content is loaded from README.md

# Maintainer information displayed in package metadata.
authors = [
    {name="KaikunXu", email="xukaikun.bio@qq.com"},
]

# Search terms that help users discover the package on PyPI.
keywords = [
    "chemistry",               # Analytical chemistry domain
    "metabolomics",            # Primary omics application area
    "bioinformatics",          # Computational biology context
    "chemometrics",            # Statistical analysis of chemical data
    "lc-ms",                   # Liquid chromatography-mass spectrometry
    "mass-spectrometry",       # Instrument platform and data source
    "data analysis",           # General data-processing discoverability
    "quality control",         # Core package purpose
    "quality assurance"        # QC/QA workflow discoverability
]

# Short package summary shown on PyPI search and project pages.
description = """\
A traceable and adaptive LC-MS metabolomics quality-control and preprocessing \
package for dataset construction, feature filtering, signal correction, \
missing-value imputation, normalization, quality assessment, and reporting.\
"""

requires-python = ">=3.10"      # Supports modern Python features and type hints
license = "MIT"                 # SPDX license expression for project metadata
license-files = ["LICENSE"]     # Path to the license file

# Trove classifiers used by PyPI for package maturity and topic indexing.
classifiers = [
    "Development Status :: 4 - Beta",         # Current project maturity level
    "Programming Language :: Python :: 3",    # Python 3 compatible package
    "Operating System :: OS Independent",     # Platform-independent source
    "Intended Audience :: Science/Research",  # Target research users
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]

# ==============================================================================
# PROJECT DEPENDENCIES
# Categorized runtime requirements for core and extended functionality.
# ==============================================================================
dependencies = [
    # --- Infrastructure & Configuration ---
    "pydantic>=2.4.0",                          # Framework for type-checking
    "tomli>=2.0.1; python_version < '3.11'",    # Fallback for TOML parsing

    # --- Scientific Computing & Data Processing ---
    "numpy>=1.21.0",         # N-dim arrays and linear algebra operations
    "pandas>=2.0.0",         # Core DataFrame structures for metabolomics data
    "scipy>=1.7.0",          # Scientific algorithms and statistical testing
    "scikit-learn>=1.0.2",   # Machine learning for PCA and imputation tasks
    
    # --- Performance & Engineering ---
    "numba>=0.56.0",         # JIT compilation for high-performance math engines
    "joblib>=1.3.0",         # Lightweight pipelining and parallel processing
    "tqdm>=4.65.0",          # Fast, extensible progress bars for loops
    "loguru>=0.6.0",         # Simplified and robust logging management
    
    # --- System & Hardware Diagnostics ---
    "psutil>=5.8.0",         # Cross-platform system memory and power monitoring
    "py-cpuinfo>=9.0.0",     # Accurate CPU model and architecture ID

    # --- Data Visualization ---
    "matplotlib>=3.3.0",     # Fundamental 2D plotting engine
    "seaborn>=0.11.0",       # Statistical data visualization based on mpl
    "plotnine>=0.10.1",      # Grammar of Graphics implementation
    
    # --- Report Assembly & Image Handling ---
    "patchworklib>=0.6.2",   # Composition tool for matplotlib subplots
    "svgutils>=0.3.4",       # Composition and layout manipulation for SVG grids
    "ipython>=7.0.0",        # Interactive display support for Jupyter
    "cairosvg>=2.7.0",       # Vector to raster/PDF conversion engine


    # --- Markdown & PDF Report Generation ---
    "Jinja2>=3.1.0",         # Templating for dynamic MD reports
    "tabulate>=0.10.0",      # Converts DataFrames to MD tables
    "pypandoc[tinytex]>=1.11"# MD to PDF engine with automated LaTeX fallback

]

# ==============================================================================
# PROJECT URLS
# External links for source code, documentation, and issue tracking.
# ==============================================================================
[project.urls]
"Homepage" = "https://github.com/PHOENIXcenter/pi-metaboqc"  # Source repository
"Bug Tracker" = "https://github.com/PHOENIXcenter/pi-metaboqc/issues"  # Issues

# ==============================================================================
# SETTOOLS SPECIFIC CONFIGURATION
# Internal settings for package discovery and non-code asset management.
# ==============================================================================
[tool.setuptools.packages.find]
where = ["src"]                 # Locate import packages under src directory
include = ["pimqc*"]            # Include only packages starting with pimqc

[tool.setuptools.package-data]
# Non-Python resources bundled into the installed pimqc package.
"pimqc" = [
    "data/*.csv",               # Demo meta and intensity data files
    "data/*.toml",              # Demo conf file (default format)
    "data/*.json",              # Demo conf file (optional format for webserver)
    "templates/*.j2",           # Template files for report
]

[tool.setuptools.dynamic]
readme = {file = "README.md", content-type = "text/markdown"}  # PyPI README

# ==============================================================================
# OPTIONAL DEPENDENCIES
# Requirements for testing and specific R-integration workflows.
# ==============================================================================
[project.optional-dependencies]
test = [
    "pytest>=7.0.0",            # Core testing framework
    "rpy2>=3.5.0",              # R-interface for algorithm benchmarking
]
pdf = [
    "weasyprint>=61.0"          # Primary HTML-to-PDF rendering engine
]
